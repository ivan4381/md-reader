<!doctype html>
<html lang="id" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>MD Reader</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="bar">
  <button id="back" class="ib" hidden aria-label="Kembali">←</button>
  <div id="title">MD Reader</div>
  <button id="tocBtn" class="ib" hidden aria-label="Daftar isi">☰</button>
  <button id="menuBtn" class="ib" aria-label="Menu">⋯</button>
</header>
<main id="view"></main>
<div id="sheetWrap" hidden><div id="backdrop"></div><div id="sheet"></div></div>
<div id="toast" hidden></div>
<script src="marked.min.js"></script>
<script src="purify.min.js"></script>
<script src="highlight.min.js"></script>
<script>/* cadangan bila file lokal tidak ada */
if(!window.marked)document.write('<script src="https://cdn.jsdelivr.net/npm/marked@18.2.0/lib/marked.umd.js"><\/script>');
if(!window.DOMPurify)document.write('<script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.17/dist/purify.min.js"><\/script>');
if(!window.hljs)document.write('<script src="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.12.0/highlight.min.js"><\/script>');
</script>
<script src="app.js"></script>
</body>
</html>
